  var rb=btn(lbl,function(){
    if(!armed){armed=true;rb.textContent="Zeker weten? Tik nogmaals";rt=setTimeout(function(){armed=false;rb.textContent=lbl},4000);return}
    clearTimeout(rt);armed=false;rb.textContent=lbl;state={};save();setSync("De week van "+short(mondayOf(sel))+" is gewist.");
  });
  rb.classList.add("warn");
  btn("Uitloggen",doLogout);
  c.appendChild(bt);box.appendChild(c);
  var p=h("p","small pad3","Alles wat je invult wordt eerst op dit toestel bewaard en daarna op je account, zodat je telefoon en laptop gelijk blijven.");box.appendChild(p);
  var sy=h("p","sync",syncMsg);sy.id="sync";box.appendChild(sy);
}

/* ---------- Algemeen ---------- */
function render(){
  var box=$("view");if(!box)return;box.textContent="";
  if(view==="week")renderWeek(box);else if(view==="month")renderMonth(box);else if(view==="more")renderMore(box);else renderToday(box);
  [].forEach.call($("tabs").children,function(b){
    var on=b.getAttribute("data-v")===view;b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
}
function refresh(){if(view==="today"){drawStrip();drawTiles();updateCounts()}}
function setView(v){view=v;if(v==="month")shown={y:sel.getFullYear(),m:sel.getMonth()};render();window.scrollTo(0,0)}
function pick(d){
  var oldWk=wkIso;sel=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  shown={y:sel.getFullYear(),m:sel.getMonth()};
  if(iso(mondayOf(sel))!==oldWk)load();
  render();
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(b)setView(b.getAttribute("data-v"))});
var syncing=false;
async function syncAll(){
  if(!sb||!uid||syncing)return;
  syncing=true;
  try{
    var r=await sb.from("weekschema_weeks").select("week,payload");
    if(r.error)throw r.error;
    cloud=true;
    var changed=false,seen={},jobs=[];
    (r.data||[]).forEach(function(row){
      var w=String(row.week).slice(0,10);seen[w]=1;
      var cs=row.payload||{},key="weekschema-"+w,ls={};
      try{ls=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
      if((cs._t||0)>(ls._t||0)){
        try{localStorage.setItem(key,JSON.stringify(cs))}catch(e){}
        if(key===KEY)changed=true;
      }else if((ls._t||0)>(cs._t||0)){jobs.push(push(key,ls))}
    });
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i)||"",mm=/^weekschema-(\d{4}-\d\d-\d\d)$/.exec(k);
      if(mm&&!seen[mm[1]]){try{jobs.push(push(k,JSON.parse(localStorage.getItem(k)||"{}")))}catch(e){}}
    }
    await Promise.all(jobs);
    setSync("Bewaard op je account.");
    if(changed){load();render()}else refresh();
  }catch(e){setSync("Even geen verbinding met je account; bewaard op dit toestel.")}
  syncing=false;
}
function showApp(){$("login").hidden=true;$("app").hidden=false;$("tabs").hidden=false;load();render()}
function showLogin(){$("app").hidden=true;$("tabs").hidden=true;$("login").hidden=false}
function enter(ses){
  if(!ses||!ses.user)return;
  if(uid===ses.user.id)return;
  uid=ses.user.id;showApp();syncAll();
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)syncAll()});
var BACK=location.origin+location.pathname,recovering=false;
function msg(t){var lm=$("lm");lm.hidden=!t;lm.textContent=t||""}
function errNl(e){
  var m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "E-mailadres of wachtwoord klopt niet.";
  if(/not confirmed/i.test(m))return "Je e-mailadres is nog niet bevestigd. Klik eerst op de link in de bevestigingsmail.";
  if(/already registered/i.test(m))return "Er bestaat al een account met dit e-mailadres. Log in, of kies ‘Wachtwoord vergeten?’.";
  if(/at least|password should/i.test(m))return "Kies een wachtwoord van minstens 6 tekens.";
  if(/signups? not allowed|signup is disabled/i.test(m))return "Nieuwe accounts aanmaken staat uit.";
  if(/rate limit|too many/i.test(m))return "Te veel pogingen. Probeer het over een paar minuten opnieuw.";
  return "Dat lukte niet: "+m;
}
$("lf").addEventListener("submit",async function(e){
  e.preventDefault();
  var em=$("em").value.trim(),pw=$("pw").value,lb=$("lb");if(!em||!pw)return;
  lb.disabled=true;msg("Bezig met inloggen…");
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  lb.disabled=false;
  if(r.error){msg(errNl(r.error));return}
  msg("");enter(r.data.session);
});
$("su").addEventListener("click",async function(){
  var em=$("em").value.trim(),pw=$("pw").value;
  if(!em||pw.length<6){msg("Vul je e-mailadres en een wachtwoord van minstens 6 tekens in, en tik dan op ‘Account aanmaken’.");return}
  msg("Account wordt aangemaakt…");
  var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:BACK}});
  if(r.error){msg(errNl(r.error));return}
  if(r.data.session){msg("");enter(r.data.session);return}
  if(r.data.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0){msg("Er bestaat al een account met dit e-mailadres. Tik op ‘Wachtwoord vergeten?’ om een wachtwoord in te stellen.");return}
  msg("Gelukt! Je krijgt een mail om je e-mailadres te bevestigen. Klik op de link en log daarna hier in met je wachtwoord.");
});
$("fg").addEventListener("click",async function(){
  var em=$("em").value.trim();
  if(!em){msg("Vul eerst je e-mailadres in en tik dan opnieuw op ‘Wachtwoord vergeten?’.");return}
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:BACK});
  if(r.error){msg(errNl(r.error));return}
  msg("Je krijgt een mail met een link om een nieuw wachtwoord in te stellen.");
});
function showReset(){
  showLogin();$("lf").hidden=true;$("lx").hidden=true;$("rf").hidden=false;
  $("lp").textContent="Kies een nieuw wachtwoord.";msg("");
}
$("rf").addEventListener("submit",async function(e){
  e.preventDefault();
  var r=await sb.auth.updateUser({password:$("npw").value});
  if(r.error){msg(errNl(r.error));return}
  recovering=false;$("rf").hidden=true;$("lf").hidden=false;$("lx").hidden=false;$("lp").textContent="Log in met je e-mailadres en wachtwoord.";msg("");
  var s=(await sb.auth.getSession()).data.session;if(s)enter(s);
});
function importData(obj){
  var n=0;
  function asObj(v){if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){return null}}return (v&&typeof v==="object"&&!Array.isArray(v))?v:null}
  function put(w,v){
    var st=asObj(v);if(!st)return;
    if(st.payload!==undefined){st=asObj(st.payload);if(!st)return}
    if(!st._t)st._t=Date.now();
    var key="weekschema-"+w,ls={};
    try{ls=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
    if((ls._t||0)>st._t)return;
    try{localStorage.setItem(key,JSON.stringify(st))}catch(e){return}
    push(key,st).catch(function(){});n++;
  }
  function walk(o){
    if(Array.isArray(o)){o.forEach(walk);return}
    if(!o||typeof o!=="object")return;
    var id=o.id||o.week||o.key;
    if(typeof id==="string"&&/^(weekschema-|w)?\d{4}-\d\d-\d\d$/.test(id)&&(o.payload!==undefined||o.data!==undefined)){put(id.slice(-10),o.payload!==undefined?o.payload:o.data);return}
    for(var k in o){
      if(/^(weekschema-|w)?\d{4}-\d\d-\d\d$/.test(k))put(k.slice(-10),o[k]);
      else if(o[k]&&typeof o[k]==="object")walk(o[k]);
    }
  }
  walk(obj);return n;
}
$("impf").addEventListener("change",function(){
  var f=this.files&&this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var n=0;try{n=importData(JSON.parse(rd.result))}catch(e){}
    load();render();
    setSync(n?n+(n===1?" week":" weken")+" geïmporteerd.":"In dit bestand vond ik geen weekgegevens.");
  };
  rd.readAsText(f);$("impf").value="";
});
(async function start(){
  if(!sb){showApp();setSync("Bewaard op dit toestel.");return}
  recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(function(ev,ses){
    if(ev==="PASSWORD_RECOVERY"){recovering=true;setTimeout(showReset,0);return}
    if(recovering)return;
    if(ses)setTimeout(function(){enter(ses)},0);
    else if(ev==="SIGNED_OUT")showLogin();
  });
  var s=(await sb.auth.getSession()).data.session;
  if(recovering){showReset();return}
  if(s)enter(s);else if(!uid)showLogin();
})();
</script>
